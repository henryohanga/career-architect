name: ATS Score Check

on:
  pull_request:
    paths:
      - "applications/**/resume.md"

jobs:
  ats:
    name: ATS Keyword Score
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed application folders
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep -E '^applications/[^/]+/resume\.md$' | \
            sed 's|applications/||;s|/.*||' | sort -u | tr '\n' ' ' || true)
          echo "folders=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed folders: $CHANGED"

      - name: Run ATS scoring
        id: ats
        run: |
          REPORT=""
          LOWEST=100
          for folder in ${{ steps.detect.outputs.folders }}; do
            APP_DIR="applications/$folder"
            if [ ! -f "$APP_DIR/resume.md" ]; then continue; fi

            RESULT=$(python scripts/ats_score.py "$APP_DIR" 2>&1 || true)
            SCORE=$(echo "$RESULT" | grep -oP '\d+(?=%)' | head -1 || echo "N/A")

            if [ "$SCORE" != "N/A" ] && [ "$SCORE" -lt "$LOWEST" ]; then
              LOWEST=$SCORE
            fi

            # Build status icon
            if [ "$SCORE" = "N/A" ]; then
              ICON="⚪"
            elif [ "$SCORE" -ge 80 ]; then
              ICON="✅"
            elif [ "$SCORE" -ge 50 ]; then
              ICON="⚠️"
            else
              ICON="❌"
            fi

            REPORT="$REPORT
          ### $ICON \`$folder\` — $SCORE%

          \`\`\`
          $RESULT
          \`\`\`
          "
          done

          # Write to output (multiline)
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "lowest=$LOWEST" >> $GITHUB_OUTPUT

      - name: Post ATS score comment
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.ats.outputs.report }}`;
            const lowest = parseInt('${{ steps.ats.outputs.lowest }}') || 0;

            let summary = '';
            if (lowest >= 80) {
              summary = '✅ All resumes pass ATS threshold (≥80%).';
            } else if (lowest >= 50) {
              summary = '⚠️ Some resumes are below 80% — consider adding missing keywords before submitting.';
            } else {
              summary = '❌ One or more resumes are below the 50% minimum ATS threshold. Please add missing keywords.';
            }

            const body = `## ATS Keyword Score Report

            ${summary}

            ${report}

            ---
            *Scores below 50% = ❌ needs work · 50–79% = ⚠️ acceptable · ≥80% = ✅ strong*
            `;

            // Delete previous ATS comments from this bot
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('ATS Keyword Score Report')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
