name: ATS Score Check

on:
  pull_request:
    paths:
      - "applications/**/resume.md"

jobs:
  ats:
    name: ATS Keyword Score
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find changed application folders
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | \
            grep -E '^applications/[^/]+/resume\.md$' | \
            sed 's|applications/||;s|/.*||' | sort -u | tr '\n' ' ' || true)
          echo "folders=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed folders: $CHANGED"

      - name: Validate resumes (guardrails)
        run: |
          FAILED=0
          for folder in ${{ steps.detect.outputs.folders }}; do
            APP_DIR="applications/$folder"
            if [ -d "$APP_DIR" ]; then
              python scripts/validate_resume.py "$APP_DIR" || FAILED=1
            fi
          done
          exit $FAILED

      - name: Run ATS scoring
        id: ats
        run: |
          REPORT=""
          LOWEST=100
          for folder in ${{ steps.detect.outputs.folders }}; do
            APP_DIR="applications/$folder"
            if [ ! -f "$APP_DIR/resume.md" ]; then continue; fi

            RESULT=$(python scripts/ats_score.py "$APP_DIR" 2>&1 || true)
            SCORE=$(python scripts/ats_score.py "$APP_DIR" --score-only 2>/dev/null || echo "N/A")

            if [ "$SCORE" != "N/A" ]; then
              LOWEST=$(python -c "print(min(float('$LOWEST'), float('$SCORE')))")
            fi

            # Build status icon (70 = strong, 50 = minimum; see scripts/ats_score.py)
            if [ "$SCORE" = "N/A" ]; then
              ICON="⚪"
            elif python -c "exit(0 if float('$SCORE') >= 70 else 1)"; then
              ICON="✅"
            elif python -c "exit(0 if float('$SCORE') >= 50 else 1)"; then
              ICON="⚠️"
            else
              ICON="❌"
            fi

            REPORT="$REPORT
          ### $ICON \`$folder\` — $SCORE%

          \`\`\`
          $RESULT
          \`\`\`
          "
          done

          # Write to output (multiline)
          {
            echo "report<<EOF"
            echo "$REPORT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "lowest=$LOWEST" >> $GITHUB_OUTPUT

      - name: Post ATS score comment
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.ats.outputs.report }}`;
            const lowest = parseFloat('${{ steps.ats.outputs.lowest }}') || 0;

            let summary = '';
            if (lowest >= 70) {
              summary = '✅ All resumes meet the strong ATS target (≥70%).';
            } else if (lowest >= 50) {
              summary = '⚠️ Some resumes are below the 70% strong target — consider adding missing keywords before submitting.';
            } else {
              summary = '❌ One or more resumes are below the 50% minimum ATS threshold. Please add missing keywords.';
            }

            const body = `## ATS Keyword Score Report

            ${summary}

            ${report}

            ---
            *Scores below 50% = ❌ needs work · 50–69% = ⚠️ acceptable · ≥70% = ✅ strong*
            `;

            // Delete previous ATS comments from this bot
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('ATS Keyword Score Report')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
